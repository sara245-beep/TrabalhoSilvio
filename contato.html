<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/estilo.css">
    <title>Usando a barra de navegação</title>
</head>

<body>
    <nav>
        <h1>Site Pridesing3D</h1>
        <a href="index.html">Inicio</a>
        <a href="contato.html">Contato</a>
    </nav>

    <main>
        <section class="formulário">

            <h2 class="tituloform"> Fale conosco </h2>
            <form id="formContato">
                <label for="nome"> Nome: </label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

                <label for="email"> E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

                <label for="telefone"> Telefone</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" required>

                <label for="assunto">Assunto:</label>
                <select id="assunto" name="assunto" required>


                    <option value=""> Selecione </option>
                    <option value="duvida"> Dúvida </option>
                    <option value="orcamento"> Orçamento </option>
                    <option value="outro"> Outro </option>
                </select>
                <label for="mensagem">
                    Mensagem:
                </label>

                <textarea id="mensagem" name="mensagem" placeholder="Digite sua mensagem" required></textarea>

                <button type"submit"> Enviar </button>

                <div id="resultado"></div>
            </form>
            </section>


          


    </main>

    <footer>
        <p> @ 2026 - Pridesign</p>
    </footer>

    
        <script src="js/app.js"> </script>
    

    </section>
    </main>
